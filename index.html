<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Florida Flood Monitoring System</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ══ HEADER ══ -->
  <header>
    <div class="header-left">
      <svg class="wave-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="19" fill="rgba(0,198,255,0.12)" stroke="#00c6ff" stroke-width="1.5"/>
        <path d="M6 22 Q10 16 14 22 Q18 28 22 22 Q26 16 34 22"
              stroke="#00c6ff" stroke-width="2.2" stroke-linecap="round" fill="none"/>
        <path d="M6 26 Q10 20 14 26 Q18 32 22 26 Q26 20 34 26"
              stroke="#0057a8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity=".7"/>
      </svg>
      <div class="title-block">
        <div class="title-main">🌊 Florida Flood Monitoring</div>
        <div class="title-sub">Early Warning System</div>
      </div>
    </div>

    <div class="status-bar">
      <div class="pill ok">
        <span class="dot" id="live-dot"></span>
        Live Data
      </div>
      <div class="pill warn">
        <span class="dot"></span>
        <span id="active-count">…</span>&nbsp;Active
      </div>
      <div class="live-badge">LIVE</div>
    </div>
  </header>

  <!-- ══ MAP ══ -->
  <div class="map-wrapper">
    <div class="loader" id="loader">
      <div class="spinner"></div>
      <div class="loader-text">Loading Dashboard…</div>
    </div>
    <iframe
      id="dashFrame"
      src="https://www.arcgis.com/apps/dashboards/b42516ab0a3b463b9b6aea9d32cd30ef"
      title="Florida Flood Monitoring Dashboard"
      allowfullscreen
      loading="lazy"
      onload="onDashboardLoaded()"
    ></iframe>
  </div>

  <!-- ══ FOOTER RIBBON ══ -->
  <div class="ribbon">
    Data:&nbsp;<span>FDEP · NOAA · USGS · EPA</span>
    &nbsp;|&nbsp; Refreshes every <span>15 min</span>
    &nbsp;|&nbsp; <span id="last-updated">fetching…</span>
  </div>

  <!-- JS loaded last so the HTML elements above exist before the script runs -->
  <script src="app.js"></script>

</body>
</html>
